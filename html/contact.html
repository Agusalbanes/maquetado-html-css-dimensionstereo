            </div>

                    <input type="text" name="name" id="name" placeholder="Escribe tu nombre" title="Nombre solo acepta letras y espacios en blanco" required>

                        <option value="Argentina">Argentina</option>
                        <option value="Chile">Chile</option>
                        <option value="Otro">otro</option>
                        </select>
                    <textarea name="comments" id="comments" placeholder="Dejanos tu comentario" required></textarea>
                    <input type="submit" class="button-enviar" value="Enviar">
                        </form>  
            </div>
        </div>
        <div class="container-contact-soda">
            <img class="img-soda" src="../assets/Soda (3).png" alt="Soda Stereo">

                <p>"No solo no hubiéramos sido nada sin ustedes"</p>
